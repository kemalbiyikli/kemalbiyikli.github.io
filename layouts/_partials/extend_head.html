<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
{{- if .IsPage }}
<script>
  addEventListener('DOMContentLoaded', () => {
    const bar = document.createElement('div');
    bar.id = 'read-progress';
    document.body.appendChild(bar);
    addEventListener('scroll', () => {
      const h = document.documentElement, p = h.scrollTop / Math.max(h.scrollHeight - h.clientHeight, 1);
      bar.style.transform = 'scaleX(' + Math.min(Math.max(p, 0), 1) + ')';
    }, { passive: true });
  });
</script>
{{- end }}
{{- if .IsPage }}
<script>
  addEventListener('DOMContentLoaded', () => {
    const imgs = document.querySelectorAll('.post-content img');
    if (!imgs.length) return;
    const box = document.createElement('div');
    box.id = 'lightbox';
    box.innerHTML = '<img alt="">';
    document.body.appendChild(box);
    const big = box.firstChild;
    const close = () => { box.classList.remove('open', 'zoomed'); document.documentElement.style.overflow = ''; };
    imgs.forEach(img => {
      if (img.closest('a')) return;
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', () => {
        big.src = img.currentSrc || img.src; big.alt = img.alt;
        box.classList.add('open'); document.documentElement.style.overflow = 'hidden';
      });
    });
    big.addEventListener('click', e => {
      e.stopPropagation();
      if (big.naturalWidth > innerWidth || big.naturalHeight > innerHeight) box.classList.toggle('zoomed'); else close();
    });
    box.addEventListener('click', close);
    addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  });
</script>
{{- end }}
